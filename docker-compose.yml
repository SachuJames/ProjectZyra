version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      GOOGLE_CLIENT_ID: "824775610152-qhkjic7qiq0fsn4gi1nstudh2ooskojs.apps.googleusercontent.com"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-priceradar}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      GOOGLE_CLIENT_ID: "824775610152-qhkjic7qiq0fsn4gi1nstudh2ooskojs.apps.googleusercontent.com"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-priceradar}
      REDIS_URL: redis://redis:6379/0
      SERPAPI_KEY: ${SERPAPI_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      GOOGLE_CLIENT_ID: "824775610152-qhkjic7qiq0fsn4gi1nstudh2ooskojs.apps.googleusercontent.com"
      CHOKIDAR_USEPOLLING: "true"
      PORT: "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
